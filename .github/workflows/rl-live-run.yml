# ─────────────────────────────────────────────────────────────────────────────
# Workflow 2: RL Agent — Live Browser Run (Rule-Based, Free)
# Spins up a real headless Chromium browser on the GitHub Actions runner,
# runs the rule-based agent across all 11 built-in tasks, and uploads
# results (JSON, CSV, screenshots) as downloadable artifacts.
#
# Triggers: on push to main/master, or manually via workflow_dispatch.
# Typical runtime: ~5–8 minutes.
# Cost: FREE (uses GitHub-hosted Ubuntu runner).
# ─────────────────────────────────────────────────────────────────────────────

name: RL Agent — Live Browser Run

on:
  push:
    branches: [main, master]
  workflow_dispatch:            # ← also allows manual "Run workflow" button
    inputs:
      agent:
        description: "Agent type"
        required: true
        default: "rule"
        type: choice
        options: [rule, llm]
      episodes:
        description: "Number of episodes"
        required: true
        default: "5"
      difficulty:
        description: "Task difficulty filter (leave blank for all)"
        required: false
        default: ""
        type: choice
        options: ["", "easy", "medium", "hard"]
      task_id:
        description: "Run a single task by ID (leave blank for random)"
        required: false
        default: ""

jobs:
  rl-run:
    name: "RL Live Run (${{ github.event.inputs.agent || 'rule' }} agent)"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Python dependencies ───────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Playwright Chromium + system deps ─────────────────────────────
      #    playwright install chromium --with-deps handles all system libs
      #    needed for headless Chrome on Ubuntu.
      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      # ── 5. Create output directories ─────────────────────────────────────
      - name: Create log directories
        run: mkdir -p logs logs/screenshots

      # ── 6. Build the CLI command from inputs (or sensible defaults) ───────
      - name: Build run command
        id: build-cmd
        run: |
          AGENT="${{ github.event.inputs.agent || 'rule' }}"
          EPISODES="${{ github.event.inputs.episodes || '5' }}"
          DIFFICULTY="${{ github.event.inputs.difficulty || '' }}"
          TASK_ID="${{ github.event.inputs.task_id || '' }}"

          CMD="python main.py --agent $AGENT --episodes $EPISODES --headless true --screenshots"
          [ -n "$DIFFICULTY" ] && CMD="$CMD --difficulty $DIFFICULTY"
          [ -n "$TASK_ID" ]   && CMD="$CMD --task-id $TASK_ID"

          echo "cmd=$CMD" >> $GITHUB_OUTPUT
          echo "Running: $CMD"

      # ── 7. Run the RL loop ───────────────────────────────────────────────
      - name: Run RL agent
        run: ${{ steps.build-cmd.outputs.cmd }}
        env:
          # Optional: add GEMINI_API_KEY or GROQ_API_KEY as a GitHub Secret
          # for LLM agent runs. Rule-based agent ignores this.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}

      # ── 8. Print summary to the Actions log ──────────────────────────────
      - name: Print results summary
        if: always()
        run: |
          echo "=== results.json ==="
          cat logs/results.json 2>/dev/null || echo "(no results file)"

      # ── 9. Upload results + screenshots as artifacts ──────────────────────
      - name: Upload results artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rl-results-${{ github.run_number }}
          path: |
            logs/results.json
            logs/episodes.csv
            logs/screenshots/
            logs/run.log
          retention-days: 30

      # ── 10. Post a job summary to the GitHub UI ───────────────────────────
      - name: Write job summary
        if: always()
        run: |
          echo "## RL Web Automation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f logs/results.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            python -c "
          import json, sys
          d = json.load(open('logs/results.json'))
          s = d.get('summary', {})
          print(json.dumps({k: v for k, v in s.items() if k != 'by_task'}, indent=2))
          " >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No results.json found." >> $GITHUB_STEP_SUMMARY
          fi
